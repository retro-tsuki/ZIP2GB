<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP2GB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #status { margin-top: 20px; padding: 10px; background: #f0f0f0; }
        .download-btn { 
            display: none; margin-top: 20px; padding: 15px 30px; 
            background: #007aff; color: white; border: none; 
            border-radius: 10px; font-weight: bold; font-size: 1.1em;
        }
    </style>
</head>
<body>
    <h1>ZIP2GB/.bandファイル復元ツール</h1>
    <p>zipを選択してください：</p>
    <input type="file" id="zip-input" accept=".zip">
    
    <div id="status">ファイルを待機中...</div>
    <button id="download-btn" class="download-btn">.band形式で復元保存</button>

    <script>
        let currentZip = null;
        let originalFileName = "";

        document.getElementById('zip-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalFileName = file.name.replace(".zip", "");
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const zip = new JSZip();
                zip.loadAsync(event.target.result).then(function(contents) {
                    currentZip = contents;
                    document.getElementById('status').innerHTML = "解析完了！<br>ボタンを押してiOSデバイスに保存してください。";
                    document.getElementById('download-btn').style.display = "inline-block";
                });
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('download-btn').addEventListener('click', function() {
            if (!currentZip) return;

            // 再びzipとして固める（iOSが展開したときに.bandフォルダになるように）
            currentZip.generateAsync({type:"blob"}).then(function(content) {
                // ファイル名を「〇〇.band.zip」にすることで、解凍時に「〇〇.band」フォルダになる
                saveAs(content, originalFileName + ".zip");
                document.getElementById('status').innerText = "ダウンロードを開始しました。ファイルアプリで確認してください。";
            });
        });
    </script>
</body>
</html>
